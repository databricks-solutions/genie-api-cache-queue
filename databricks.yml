# Databricks Asset Bundle for Genie Gateway.
#
# Deploys a Lakebase Autoscaling project + per-environment branch + endpoint,
# and a Databricks App that attaches to the branch's auto-created database.
#
# What this bundle owns end-to-end (no post_deploy hook required):
#   - postgres_projects.gateway              (one shared project across targets)
#   - postgres_branches.<env>                (per-target branch)
#   - postgres_endpoints.<env>_endpoint      (per-target read-write endpoint)
#   - apps.gateway                           (attached to the branch's `databricks_postgres` DB)
#
# On Autoscaling, declaring `apps.resources[].postgres` at create time triggers
# the platform to (a) create the SP's Postgres role with CONNECT+CREATE, and
# (b) auto-inject PGHOST / PGUSER / PGDATABASE / PGPORT / PGSSLMODE plus the
# `valueFrom: postgres` env binding. That's the entire chicken-and-egg fix —
# no PATCH-after-deploy hop, no SP-role bootstrap script.
#
# `app.yaml` at the source root is the source of truth for `command` + `env`.
# The bundle's `apps.gateway.config:` block is silently dropped by the direct
# deploy engine.
#
# Targets:
#   - dev:  per-developer branch via ${var.dev_user}; mode: development.
#   - prod: shared `production` branch; mode: production.

bundle:
  name: genie-gateway

# Per-developer overlay. Copy `databricks.local.yml.example` to
# `databricks.local.yml` and set your own `dev_user` (sanitized to lowercase
# + hyphens) when ${workspace.current_user.short_name} contains underscores
# or dots — Lakebase branch IDs reject those characters. The glob no-ops when
# no overlay exists.
include:
  - "*.local.yml"

variables:
  app_name:
    description: "Name of the Databricks App. Used as resource name + URL slug."
    default: genie-gateway
  project_id:
    description: "Lakebase Autoscaling project ID. Lowercase + hyphens, 1-63 chars."
    default: genie-gateway
  schema_name:
    description: "Postgres schema for cache tables. Owned by the app SP."
    default: genie_cache
  dev_user:
    description: |
      Used to namespace per-developer dev branches in the `dev` target.
      Lakebase branch IDs require lowercase letters, numbers, and hyphens
      (1-63 chars). ${workspace.current_user.short_name} usually fits but
      may contain underscores or dots — override one of three ways:
        1. CLI flag:        `make deploy DEV_USER=jane-doe`
        2. Env var:         `export BUNDLE_VAR_dev_user=jane-doe`
        3. Local overlay:   copy `databricks.local.yml.example` to
                            `databricks.local.yml` and edit
      Without a sanitized override, `bundle deploy` may flag the branch_id
      as different from the live branch and offer to recreate it (which
      would delete your dev cache data). Decline.
    default: ${workspace.current_user.short_name}
  branch_id:
    description: "Lakebase branch ID. Overridden per-target (dev → dev-<user>, prod → production)."
    default: dev-${var.dev_user}
  database_path:
    description: |
      Full resource path of the auto-created Postgres database under the active
      branch (e.g. projects/genie-gateway/branches/<id>/databases/db-xxxxxxxx).
      Lakebase Autoscaling auto-creates one DB per branch with a generated ID,
      and the app resource attachment needs the full path. The Makefile
      resolves this via scripts/resolve_database.sh between the branch-create
      and app-create stages of `make deploy`. For first-time deploys, leave
      empty — the first `bundle deploy` will fail on the app but create the
      branch; the Makefile then resolves the path and re-runs.
    default: ""

# Note: postgres_projects.gateway is owned by the `dev` target only. DAB
# tracks resource state per-target, so declaring the same project in both
# targets causes "project already exists" on whichever target deploys second.
# Branches under the shared project are still per-target — that's the whole
# point of the dev/prod split. To bootstrap or rotate the project itself,
# use `make deploy TARGET=dev` (which owns lifecycle).

targets:
  dev:
    mode: development
    default: true
    variables:
      branch_id:
        default: "dev-${var.dev_user}"
      # Override app_name so dev + prod don't collide (DAB's `mode: development`
      # name-mangling is skipped for resources with an explicit `name:` field).
      app_name:
        default: "dev-${var.dev_user}-genie-gateway"
    resources:
      postgres_projects:
        gateway:
          project_id: ${var.project_id}
          display_name: "Genie Gateway"
          pg_version: 17
      postgres_branches:
        gateway_branch:
          parent: ${resources.postgres_projects.gateway.id}
          branch_id: ${var.branch_id}
          # no_expiry keeps the branch alive across redeploys; without this,
          # idle branches can be auto-pruned.
          no_expiry: true
      # NOTE: no postgres_endpoints declaration. The platform auto-creates a
      # `primary` ENDPOINT_TYPE_READ_WRITE endpoint when a branch is created,
      # using the project's default_endpoint_settings. To customize endpoint
      # autoscaling (e.g. min CU < 1), PATCH the auto-created endpoint after
      # the branch exists.
      apps:
        gateway:
          name: ${var.app_name}
          description: "Genie Gateway: cache + queue + router fronting Genie API"
          source_code_path: ${workspace.file_path}
          user_api_scopes:
            - sql
            - serving.serving-endpoints
            - dashboards.genie
          resources:
            - name: postgres
              description: "Lakebase Postgres for cache + governance tables"
              postgres:
                # Substituting the resource id forces DAB to deploy the branch
                # before the app, which is required because app-create resolves
                # the postgres resource at start time.
                branch: ${resources.postgres_branches.gateway_branch.id}
                database: ${var.database_path}
                permission: CAN_CONNECT_AND_CREATE

  prod:
    mode: production
    variables:
      branch_id:
        default: production
    # NOTE: prod references the shared project's auto-created `production`
    # branch by path. The project is owned by the dev target; the production
    # branch is auto-created when the project is provisioned (it's the
    # project's `default_branch`). DAB's per-target state means declaring
    # either resource here would error with "already exists".
    resources:
      apps:
        gateway:
          name: ${var.app_name}
          description: "Genie Gateway: cache + queue + router fronting Genie API"
          source_code_path: ${workspace.file_path}
          user_api_scopes:
            - sql
            - serving.serving-endpoints
            - dashboards.genie
          resources:
            - name: postgres
              description: "Lakebase Postgres for cache + governance tables"
              postgres:
                branch: projects/${var.project_id}/branches/production
                database: ${var.database_path}
                permission: CAN_CONNECT_AND_CREATE
    permissions:
      - user_name: ${workspace.current_user.userName}
        level: CAN_MANAGE
    workspace:
      # mode: production needs an explicit root_path to satisfy "only one copy is
      # deployed" — defaulting to the deployer's home keeps deploys per-user.
      root_path: /Workspace/Users/${workspace.current_user.userName}/.bundle/${bundle.name}/${bundle.target}
