# Databricks Apps runtime config.
#
# This file is the source of truth for `command` and `env`. The bundle's
# resources.apps.gateway.config block in databricks.yml is silently dropped
# during `bundle deploy` (the direct engine warns "unknown field: config"),
# so we cannot rely on the bundle to inject env vars.
#
# OAuth scopes + the attached Lakebase resource live in the bundle. On Lakebase
# Autoscaling, declaring `apps.resources[].postgres` in the bundle triggers the
# platform to auto-inject PGHOST / PGUSER / PGDATABASE / PGPORT / PGSSLMODE
# and to bind the LAKEBASE_ENDPOINT env var below to the endpoint resource path.

name: genie-gateway
display_name: "Genie Gateway"
description: "Genie API gateway with cache, queue, and router (Autoscaling)"

command:
  - "python"
  - "-m"
  - "uvicorn"
  - "entrypoint:app"
  - "--host"
  - "0.0.0.0"
  - "--port"
  - "8000"

env:
  - name: STORAGE_BACKEND
    value: pgvector
  # Endpoint resource path (`projects/<id>/branches/<id>/endpoints/<id>`) for
  # WorkspaceClient.postgres.generate_database_credential().
  - name: LAKEBASE_ENDPOINT
    valueFrom: postgres
  - name: LAKEBASE_SCHEMA
    value: genie_cache
  - name: TRACING_ENABLED
    value: "true"
