# Databricks Apps runtime config.
#
# This file is the source of truth for `command` and `env`. The bundle's
# resources.apps.gateway.config block in databricks.yml is silently dropped
# during `bundle deploy` (the direct engine warns "unknown field: config"),
# so we cannot rely on the bundle to inject env vars.
#
# OAuth scopes + the attached Lakebase resource live in the bundle (and are
# re-applied by scripts/post_deploy.py if missing).

name: genie-gateway-v2
display_name: "Genie Gateway v2"
description: "Genie API gateway with cache, queue, and router (DAB-deployed)"

command:
  - "python"
  - "-m"
  - "uvicorn"
  - "entrypoint:app"
  - "--host"
  - "0.0.0.0"
  - "--port"
  - "8000"

env:
  - name: STORAGE_BACKEND
    value: pgvector
  - name: LAKEBASE_INSTANCE
    value: genie-gateway-v2
  - name: LAKEBASE_CATALOG
    value: default
  - name: LAKEBASE_SCHEMA
    value: genie_cache_v2
  - name: TRACING_ENABLED
    value: "true"
